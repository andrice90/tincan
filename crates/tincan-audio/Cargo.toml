[package]
name = "tincan-audio"
description = "Tincan native audio engine: capture, echo cancel, Opus, jitter buffer, mixer, soundboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tincan-core = { workspace = true }
cpal = { workspace = true }
sonora = { workspace = true }
unsafe-libopus = { workspace = true }
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }
rubato = "5"
crossbeam-channel = "0.5"
tokio = { workspace = true }
bytes = { workspace = true }
parking_lot = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }

# Same version cpal already uses. Threading: the engine thread priority. The rest: process
# loopback capture for screen share audio (src/loopback.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }
# The `#[implement]` macro of the activation completion handler names this crate.
windows-core = "0.62"

[dev-dependencies]
hound = "3"
tempfile = "3"
tracing-subscriber = { workspace = true }
