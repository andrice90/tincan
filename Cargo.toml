[workspace]
resolver = "3"
members = [
    "crates/tincan-core",
    "crates/tincan-store",
    "crates/tincan-net",
    "crates/tincan-files",
    "crates/tincan-audio",
    "crates/tincan-screen",
    "crates/tincan-app",
    "src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
# internal
tincan-core = { path = "crates/tincan-core" }
tincan-store = { path = "crates/tincan-store" }
tincan-net = { path = "crates/tincan-net" }
tincan-files = { path = "crates/tincan-files" }
tincan-audio = { path = "crates/tincan-audio" }
tincan-screen = { path = "crates/tincan-screen" }
tincan-app = { path = "crates/tincan-app" }

# transport and files (versions verified together, see docs/research/probes/union)
iroh = "1.5"
iroh-base = "1.5"
iroh-blobs = "=0.105.0"
iroh-dns = "=1.5.0"
iroh-mdns-address-lookup = "=0.6.1"
n0-mainline = "=0.8.0"
noq-proto = "1.5"

# media
cpal = "0.18"
sonora = "0.3"
unsafe-libopus = "0.2"
moq-video = { version = "=0.1.23", default-features = false, features = ["capture"] }

# common
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
n0-future = "0.3"
futures-lite = "2"
bytes = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.8"
chacha20poly1305 = "0.11"
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
data-encoding = "2"
rand = "0.9"
parking_lot = "0.12"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
# Unwind (not abort): decoding clips and Opus packets from peers must not be able to kill
# the app. Media threads catch panics and recover; see notes-tincan-app.md.
strip = true

# Media code is hot even in debug builds; keep it fast.
[profile.dev.package."*"]
opt-level = 2
