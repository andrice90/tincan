[package]
name = "tincan-union"
version = "0.1.0"
edition = "2024"

[dependencies]
tauri = { version = "2.12.7", features = [] }
iroh = { version = "1.5", features = ["unstable-net-report"] }
iroh-blobs = "=0.105.0"
iroh-dns = "=1.5.0"
iroh-mdns-address-lookup = "=0.6.1"
n0-mainline = "=0.8.0"
moq-video = { version = "=0.1.23", default-features = false, features = ["capture"] }
sonora = "0.3"
cpal = "0.18"
unsafe-libopus = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
n0-future = "0.3"
anyhow = "1"
blake3 = "1.8"
chacha20poly1305 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[profile.small]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
