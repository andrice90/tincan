[package]
name = "iroh-transport"
version = "0.1.0"
edition = "2024"

[dependencies]
iroh = "1.5.0"
iroh-blobs = "=0.105.0"
iroh-gossip = "=0.103.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
iroh-mdns-address-lookup = "=0.6.1"
iroh-mainline-address-lookup = "=0.6.1"
n0-future = "0.3"
bytes = "1"
rand = "0.9"

[profile.small]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
